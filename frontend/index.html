<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Academy — Laboratorio interactivo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      SOC <span>Academy</span>
    </a>
    <nav class="mainnav" id="mainnav">
      <a href="#/" data-nav="dashboard">Panel</a>
      <a href="#/curso/soc-n1" data-nav="course">Curso SOC N1</a>
      <a href="#/historial" data-nav="historial">Historial</a>
    </nav>
    <div class="user-chip" title="Usuario local (header X-User-Id)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="user-id-label">default</span>
    </div>
  </header>

  <main id="app">
    <div class="boot-loading"><div class="spinner"></div> Iniciando laboratorio…</div>
  </main>

  <footer class="footer">
    <span>SOC Academy · laboratorio local de aprendizaje · v0.1.0</span>
    <span class="footer-hint">API docs: <a href="/api/docs" target="_blank">/api/docs</a></span>
  </footer>

  <div id="toast-container"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
